services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: surgical-instrument-segmentation:jazzy-cuda12
    working_dir: /workspace
    stdin_open: true
    tty: true
    shm_size: "1gb"
    gpus: all
    environment:
      DISPLAY: ${DISPLAY:-:0}
      QT_X11_NO_MITSHM: "1"
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility,graphics
    volumes:
      - .:/workspace
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: bash
